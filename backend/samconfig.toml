version = 0.1

[default.global.parameters]
stack_name = "medical-cabinet-dev"

[default.build.parameters]
cached = true
parallel = true

[default.deploy.parameters]
region = "eu-central-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
# SesFromAddress must be a verified SES identity - change it before deploying.
parameter_overrides = "Stage=dev SesFromAddress=pbalaban6@gmail.com RequireMfa=false CorsOrigin=* DeployFrontend=true"

[prod.deploy.parameters]
stack_name = "medical-cabinet-prod"
region = "eu-central-1"
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
parameter_overrides = "Stage=prod SesFromAddress=pbalaban6@gmail.com RequireMfa=true CorsOrigin=*"

