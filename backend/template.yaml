AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Medical cabinet appointments - visitors, patient notes, scheduling and email/SMS reminders.

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues: [dev, prod]
  SesFromAddress:
    Type: String
    Description: Verified SES identity used as the sender of reminder e-mails (e.g. clinic@example.com).
  RequireMfa:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: Require TOTP MFA for all staff users.
  CorsOrigin:
    Type: String
    Default: "*"
    Description: Website origin(s) allowed to call the API from a browser - one origin, "*", or a comma-separated list. The API uses bearer tokens (no cookies), so "*" is safe; restrict it to the CloudFront address if you prefer.
  AlarmEmail:
    Type: String
    Default: ""
    Description: Optional address notified when messages land in the dead-letter queue.
  ChatModel:
    Type: String
    Default: claude-haiku-4-5-20251001
    Description: Model id used by the chat assistant (Anthropic OpenAI-compatible endpoint).
  ChatEnablePatientNotes:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Let the chat assistant read and edit clinical notes. They are sent to the LLM provider when true.
  DeployFrontend:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Create the S3 bucket and CloudFront distribution that host the React UI.
  DeployChat:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Deploy the chat assistant (Lambda + Secrets Manager secret, about 0.40 USD/month for the secret).
  UseCustomKmsKey:
    Type: String
    Default: "false"
    AllowedValues: ["true", "false"]
    Description: Encrypt the tables with your own KMS key (about 1 USD/month, you control the key). When false, DynamoDB uses its free AWS-owned key.

Conditions:
  DeployFrontendSite: !Equals [!Ref DeployFrontend, "true"]
  DeployChatApi: !Equals [!Ref DeployChat, "true"]
  UseKey: !Equals [!Ref UseCustomKmsKey, "true"]
  IsProd: !Equals [!Ref Stage, prod]
  MfaRequired: !Equals [!Ref RequireMfa, "true"]
  HasAlarmEmail: !Not [!Equals [!Ref AlarmEmail, ""]]

Globals:
  Function:
    Runtime: python3.11
    Architectures: [arm64]
    CodeUri: src/
    MemorySize: 256
    Timeout: 15
    Environment:
      Variables:
        USERS_TABLE: !Ref UsersTable
        PATIENTS_TABLE: !Ref PatientsTable
        APPOINTMENTS_TABLE: !Ref AppointmentsTable
        SETTINGS_TABLE: !Ref SettingsTable
        NOTIFICATIONS_TABLE: !Ref NotificationsTable
        DOCUMENTS_TABLE: !Ref DocumentsTable
        DOCUMENTS_BUCKET: !Ref DocumentsBucket
        REMINDER_QUEUE_URL: !Ref ReminderQueue
        REMINDER_QUEUE_ARN: !GetAtt ReminderQueue.Arn
        SCHEDULER_GROUP: !Ref ReminderScheduleGroup
        SCHEDULER_ROLE_ARN: !GetAtt SchedulerRole.Arn
        SES_FROM_ADDRESS: !Ref SesFromAddress
        POWERTOOLS_SERVICE_NAME: medical-cabinet
        CORS_ALLOW_ORIGIN: !Ref CorsOrigin
        LOG_LEVEL: INFO

Resources:
  # ------------------------------------------------------------------ encryption
  DataKey:
    Type: AWS::KMS::Key
    Condition: UseKey
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts medical cabinet data at rest (DynamoDB).
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:root
            Action: kms:*
            Resource: "*"

  # ------------------------------------------------------------------ tables
  UsersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: email, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: email-index
          KeySchema:
            - { AttributeName: email, KeyType: HASH }
          Projection: { ProjectionType: ALL }
      SSESpecification: !If [UseKey, { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }, { SSEEnabled: false }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # Clinical free-text. Kept apart from Users so it can be locked down independently.
  PatientsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
      SSESpecification: !If [UseKey, { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }, { SSEEnabled: false }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # ------------------------------------------------------------------ patient documents
  # Files attached to a patient (photos, Word, PDF). The table says what they are; the bytes live in S3.
  DocumentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: doc_id, AttributeType: S }
      KeySchema:
        - { AttributeName: user_id, KeyType: HASH }
        - { AttributeName: doc_id, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }  # uploads never completed
      SSESpecification: !If [UseKey, { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }, { SSEEnabled: false }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProd, true, false]

  # Private, encrypted, never public. The browser uploads and downloads with 5-minute signed links,
  # so it needs CORS for PUT/GET from the admin site. Kept if the stack is deleted (medical records).
  DocumentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ ObjectOwnership: BucketOwnerEnforced }]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: !If
              - UseKey
              - { SSEAlgorithm: "aws:kms", KMSMasterKeyID: !GetAtt DataKey.Arn }
              - { SSEAlgorithm: AES256 }
            BucketKeyEnabled: !If [UseKey, true, false]
      CorsConfiguration:
        CorsRules:
          - AllowedMethods: [GET, PUT]
            AllowedOrigins: !Split [",", !Ref CorsOrigin]
            AllowedHeaders: ["*"]
            MaxAge: 3600
      LifecycleConfiguration:
        Rules:
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: { DaysAfterInitiation: 1 }

  AppointmentsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: appointment_id, AttributeType: S }
        - { AttributeName: user_id, AttributeType: S }
        - { AttributeName: day, AttributeType: S }
        - { AttributeName: start_at, AttributeType: S }
      KeySchema:
        - { AttributeName: appointment_id, KeyType: HASH }
      GlobalSecondaryIndexes:
        - IndexName: user-index
          KeySchema:
            - { AttributeName: user_id, KeyType: HASH }
            - { AttributeName: start_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
        - IndexName: day-index
          KeySchema:
            - { AttributeName: day, KeyType: HASH }
            - { AttributeName: start_at, KeyType: RANGE }
          Projection: { ProjectionType: ALL }
      SSESpecification: !If [UseKey, { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }, { SSEEnabled: false }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }
      DeletionProtectionEnabled: !If [IsProd, true, false]

  SettingsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: setting_id, AttributeType: S }
      KeySchema:
        - { AttributeName: setting_id, KeyType: HASH }
      SSESpecification: !If [UseKey, { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }, { SSEEnabled: false }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  NotificationsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - { AttributeName: appointment_id, AttributeType: S }
        - { AttributeName: sk, AttributeType: S }
      KeySchema:
        - { AttributeName: appointment_id, KeyType: HASH }
        - { AttributeName: sk, KeyType: RANGE }
      TimeToLiveSpecification: { AttributeName: ttl, Enabled: true }
      SSESpecification: !If [UseKey, { SSEEnabled: true, SSEType: KMS, KMSMasterKeyId: !GetAtt DataKey.Arn }, { SSEEnabled: false }]
      PointInTimeRecoverySpecification: { PointInTimeRecoveryEnabled: true }

  # ------------------------------------------------------------------ auth (staff only)
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-staff
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      MfaConfiguration: !If [MfaRequired, "ON", "OFF"]
      EnabledMfas: !If [MfaRequired, [SOFTWARE_TOKEN_MFA], !Ref AWS::NoValue]
      Policies:
        PasswordPolicy:
          MinimumLength: 12
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      AccountRecoverySetting:
        RecoveryMechanisms:
          - { Name: verified_email, Priority: 1 }
      DeletionProtection: !If [IsProd, ACTIVE, INACTIVE]

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      # Password flow is for dev/testing from the CLI only; prod uses SRP.
      ExplicitAuthFlows: !If
        - IsProd
        - [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
        - [ALLOW_USER_SRP_AUTH, ALLOW_USER_PASSWORD_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      PreventUserExistenceErrors: ENABLED
      AccessTokenValidity: 60
      IdTokenValidity: 60
      RefreshTokenValidity: 12
      TokenValidityUnits: { AccessToken: minutes, IdToken: minutes, RefreshToken: hours }

  GroupReception:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: reception, Description: Manage visitors and appointments }
  GroupClinician:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: clinician, Description: Additionally read/write patient notes }
  GroupAdmin:
    Type: AWS::Cognito::UserPoolGroup
    Properties: { UserPoolId: !Ref UserPool, GroupName: admin, Description: Additionally change reminder settings }

  # ------------------------------------------------------------------ API
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # CORS is answered by the Lambdas (see CORS_ALLOW_ORIGIN), not by API Gateway.
      DefaultRouteSettings:
        ThrottlingBurstLimit: 50
        ThrottlingRateLimit: 25
      Auth:
        DefaultAuthorizer: CognitoJwt
        Authorizers:
          CognitoJwt:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              issuer: !Sub https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}
              audience: [!Ref UserPoolClient]

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.api.handler
      Description: REST API for users, patients, appointments and reminder settings.
      Environment:
        Variables:
          # SecureString created by hand (see README): {"token": "<random>", "signing_key": "<optional>"}
          SMS_WEBHOOK_PARAMETER: !Sub /${AWS::StackName}/sms-webhook
      Policies:
        - DynamoDBCrudPolicy: { TableName: !Ref UsersTable }
        - DynamoDBCrudPolicy: { TableName: !Ref PatientsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref AppointmentsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref SettingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref DocumentsTable }
        - S3CrudPolicy: { BucketName: !Ref DocumentsBucket }
        # Crud (not Read): visitor SMS replies and their de-duplication records live in this table.
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationsTable }
        - SQSSendMessagePolicy: { QueueName: !GetAtt ReminderQueue.QueueName }
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/sms-webhook
            - !If
              - UseKey
              - Effect: Allow
                Action: [kms:Encrypt, kms:Decrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action: [scheduler:CreateSchedule, scheduler:DeleteSchedule]
              Resource: !Sub arn:${AWS::Partition}:scheduler:${AWS::Region}:${AWS::AccountId}:schedule/${ReminderScheduleGroup}/*
            - Effect: Allow
              Action: iam:PassRole
              Resource: !GetAtt SchedulerRole.Arn
              Condition:
                StringEquals:
                  iam:PassedToService: scheduler.amazonaws.com
      Events:
        Any:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY
        # The SMS gateway app calls this when a visitor replies. It cannot log in, so no authorizer:
        # the Lambda checks the secret in the URL (and the gateway's signature) itself.
        SmsWebhook:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /webhooks/sms/{token}
            Method: POST
            Auth:
              Authorizer: NONE
        # Browsers send an unauthenticated OPTIONS "pre-check" before any call that carries a token.
        # Without this route the catch-all above would demand a login for it and every call would fail
        # with a CORS error. This route has no authorizer; the Lambda answers it with the CORS headers.
        Preflight:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # ------------------------------------------------------------------ chat assistant
  # Set the key after the first deploy (never put it in this file):
  #   aws secretsmanager put-secret-value --secret-id <ChatApiKeySecretArn> --secret-string "sk-ant-..."
  ChatApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Condition: DeployChatApi
    Properties:
      Description: API key of the LLM provider used by the chat assistant.

  ChatFunction:
    Type: AWS::Serverless::Function
    Condition: DeployChatApi
    Properties:
      Handler: lambda_entry.handler
      CodeUri: ../chat-server/src/ # src/ only: the local .env with the key lives one level up
      Description: Chat assistant. Calls the LLM and uses the API Lambda as tools, with the caller's own identity.
      MemorySize: 512
      Timeout: 29 # API Gateway HTTP APIs cut connections at 30 s
      Environment:
        Variables:
          API_FUNCTION_NAME: !Ref ApiFunction
          LLM_API_KEY_SECRET_ARN: !Ref ChatApiKeySecret
          LLM_MODEL: !Ref ChatModel
          ENABLE_PATIENT_NOTES: !Ref ChatEnablePatientNotes
      Policies:
        - LambdaInvokePolicy: { FunctionName: !Ref ApiFunction }
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref ChatApiKeySecret
      Events:
        Chat:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /chat, Method: POST }
        ChatHealth:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /chat/health, Method: GET }
        # Browser pre-checks for the two routes above: no token, so no authorizer.
        ChatPreflight:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /chat, Method: OPTIONS, Auth: { Authorizer: NONE } }
        ChatHealthPreflight:
          Type: HttpApi
          Properties: { ApiId: !Ref HttpApi, Path: /chat/health, Method: OPTIONS, Auth: { Authorizer: NONE } }

  # ------------------------------------------------------------------ website (optional)
  SiteBucket:
    Type: AWS::S3::Bucket
    Condition: DeployFrontendSite
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }

  SiteOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: DeployFrontendSite
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-site
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # The chat UI is served from / and the admin UI from /admin/. S3 has no directory index, so map
  # "/admin/" to "/admin/index.html" and send "/admin" to "/admin/".
  SiteIndexRewrite:
    Type: AWS::CloudFront::Function
    Condition: DeployFrontendSite
    Properties:
      Name: !Sub ${AWS::StackName}-index-rewrite
      AutoPublish: true
      FunctionConfig:
        Comment: Serve index.html for directory URLs
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          if (request.uri === '/admin') {
            return { statusCode: 301, statusDescription: 'Moved Permanently', headers: { location: { value: '/admin/' } } };
          }
          if (request.uri.endsWith('/')) {
            request.uri += 'index.html';
          }
          return request;
        }

  SiteDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: DeployFrontendSite
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub ${AWS::StackName} chat UI
        DefaultRootObject: index.html
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt SiteOriginAccessControl.Id
            S3OriginConfig: { OriginAccessIdentity: "" }
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # Managed-CachingOptimized
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
          FunctionAssociations:
            - { EventType: viewer-request, FunctionARN: !GetAtt SiteIndexRewrite.FunctionARN }
        CustomErrorResponses: # single-page app: unknown paths serve index.html
          - { ErrorCode: 403, ResponseCode: 200, ResponsePagePath: /index.html }
          - { ErrorCode: 404, ResponseCode: 200, ResponsePagePath: /index.html }

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: DeployFrontendSite
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub ${SiteBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${SiteDistribution}

  # ------------------------------------------------------------------ reminders
  ReminderScheduleGroup:
    Type: AWS::Scheduler::ScheduleGroup
    Properties:
      Name: !Sub ${AWS::StackName}-reminders

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: scheduler.amazonaws.com }
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref AWS::AccountId
      Policies:
        - PolicyName: send-to-reminder-queue
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt ReminderQueue.Arn

  ReminderDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true

  ReminderQueue:
    Type: AWS::SQS::Queue
    Properties:
      VisibilityTimeout: 180 # >= 6x SenderFunction timeout
      SqsManagedSseEnabled: true # SQS-managed keys: the Scheduler role needs no KMS permissions
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt ReminderDeadLetterQueue.Arn
        maxReceiveCount: 3

  SenderFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: handlers.sender.handler
      Description: Delivers queued reminders by e-mail (SES) and SMS (Android phone gateway).
      Timeout: 30
      Environment:
        Variables:
          # SecureString created by hand (see README): {"username": "...", "password": "..."}
          SMS_GATEWAY_PARAMETER: !Sub /${AWS::StackName}/sms-gateway
      # No access to the Patients table: messages never contain clinical data.
      Policies:
        - DynamoDBReadPolicy: { TableName: !Ref UsersTable }
        - DynamoDBReadPolicy: { TableName: !Ref AppointmentsTable }
        - DynamoDBReadPolicy: { TableName: !Ref SettingsTable }
        - DynamoDBCrudPolicy: { TableName: !Ref NotificationsTable }
        - Version: "2012-10-17"
          Statement:
            - !If
              - UseKey
              - Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - !Ref AWS::NoValue
            - Effect: Allow
              Action: ses:SendEmail
              Resource: !Sub arn:${AWS::Partition}:ses:${AWS::Region}:${AWS::AccountId}:identity/*
            - Effect: Allow
              Action: ssm:GetParameter
              Resource: !Sub arn:${AWS::Partition}:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${AWS::StackName}/sms-gateway
      Events:
        Reminders:
          Type: SQS
          Properties:
            Queue: !GetAtt ReminderQueue.Arn
            BatchSize: 5
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 5

  # ------------------------------------------------------------------ monitoring
  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: HasAlarmEmail
    Properties:
      Subscription:
        - { Protocol: email, Endpoint: !Ref AlarmEmail }

  DeadLetterAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: A reminder could not be delivered after 3 attempts.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - { Name: QueueName, Value: !GetAtt ReminderDeadLetterQueue.QueueName }
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If [HasAlarmEmail, [!Ref AlarmTopic], !Ref AWS::NoValue]

Outputs:
  ApiUrl:
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  UserPoolId:
    Value: !Ref UserPool
  DocumentsBucketName:
    Description: Private bucket holding the files attached to patients
    Value: !Ref DocumentsBucket
  UserPoolClientId:
    Value: !Ref UserPoolClient
  ChatApiKeySecretArn:
    Condition: DeployChatApi
    Description: Store the LLM key here with aws secretsmanager put-secret-value
    Value: !Ref ChatApiKeySecret
  SiteUrl:
    Condition: DeployFrontendSite
    Value: !Sub https://${SiteDistribution.DomainName}
  AdminSiteUrl:
    Condition: DeployFrontendSite
    Value: !Sub https://${SiteDistribution.DomainName}/admin/
  SiteBucketName:
    Condition: DeployFrontendSite
    Value: !Ref SiteBucket
  SiteDistributionId:
    Condition: DeployFrontendSite
    Value: !Ref SiteDistribution
  ReminderQueueUrl:
    Value: !Ref ReminderQueue
  DeadLetterQueueUrl:
    Value: !Ref ReminderDeadLetterQueue
